[workspace]
resolver = "2"
members = ["crates/cordis", "crates/cordis-macros", "crates/cordis-component-api", "crates/cordis-loader", "crates/cordis-timer", "crates/cordis-logger"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
cordis = { path = "crates/cordis" }
cordis-macros = { path = "crates/cordis-macros" }
cordis-component-api = { path = "crates/cordis-component-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 1
