[workspace]
resolver = "2"
members = [
  "crates/yacordis",
  "crates/yacordis-component-api",
  "crates/yacordis-loader",
  "crates/yacordis-logger",
  "crates/yacordis-macros",
  "crates/yacordis-timer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yacordis = { path = "crates/yacordis" }
yacordis-component-api = { path = "crates/yacordis-component-api" }

[profile.dev]
debug = 1
