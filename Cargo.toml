[workspace]
resolver = "2"
members = ["crates/cordis", "crates/cordis-plugin-api", "crates/cordis-loader"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
cordis = { path = "crates/cordis" }
cordis-plugin-api = { path = "crates/cordis-plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 1
