[workspace]
resolver = "2"
members = ["crates/yacordis", "crates/yacordis-macros", "crates/yacordis-component-api", "crates/yacordis-loader", "crates/yacordis-timer", "crates/yacordis-logger"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
yacordis = { path = "crates/yacordis" }
yacordis-component-api = { path = "crates/yacordis-component-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 1
