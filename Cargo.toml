[workspace]
resolver = "2"
members = [
  "crates/yacordis",
  "crates/yacordis-component-api",
  "crates/yacordis-loader",
  "crates/yacordis-macros",
  "crates/yacordis-timer",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Leawind/yacordis"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yacordis = { path = "crates/yacordis", version = "0.2.0" }
yacordis-component-api = { path = "crates/yacordis-component-api", version = "0.1.0" }

[profile.dev]
debug = 1
