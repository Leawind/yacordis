id: yacordis-no-ffi-alloc
language: Rust
severity: error
message: >
  Manual allocation across the C ABI breaks the shared-allocator rule: a
  buffer must be freed by the allocator that produced it, and libc's is not
  the host's. Allocate buffers through yacordis_component_api
  (alloc_buffer/free_buffer).
rule:
  any:
    - pattern: libc::malloc($$$ARGS)
    - pattern: libc::free($$$ARGS)
