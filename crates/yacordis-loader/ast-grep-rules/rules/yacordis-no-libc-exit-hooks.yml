id: yacordis-no-libc-exit-hooks
language: Rust
severity: error
message: >
  atexit/TLS destructor hooks run outside the framework's drain phase,
  violating the resource-ownership invariant (I2). Register cleanup through
  ctx.effect so unload provably reverts it.
rule:
  any:
    - pattern: libc::atexit($$$ARGS)
    - pattern: std::process::exit($$$ARGS)
