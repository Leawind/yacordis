id: yacordis-no-mutable-static
language: Rust
severity: error
message: >
  Mutable statics survive reloads and are shared by two generations of the
  component, violating the no-cross-install-state invariant (I3). Keep state
  in fiber-scoped resources registered through ctx.
rule:
  any:
    - pattern: "static mut $NAME: $TYPE = $INIT"
    - pattern: "static $NAME: std::sync::Mutex<$T> = $INIT"
    - pattern: "static $NAME: std::sync::OnceLock<$T> = $INIT"
    - pattern: "static $NAME: std::sync::LazyLock<$T> = $INIT"
