[package]
name = "demo-component"
description = "A cdylib component used by cordis-loader's integration test"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cordis-component-api = { path = "../../../../cordis-component-api" }
serde_json = "1"

# Deliberately its own workspace: components are built outside the host's
# workspace, with their own dependency resolution.
[workspace]
