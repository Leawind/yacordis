[package]
name = "demo-plugin"
description = "A cdylib plugin used by cordis-loader's integration test"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cordis-plugin-api = { path = "../../../../cordis-plugin-api" }
serde_json = "1"

# Deliberately its own workspace: plugins are built outside the host's
# workspace, with their own dependency resolution.
[workspace]
