[package]
name = "cordis-loader"
description = "Runtime installer for cordis plugins distributed as prebuilt cdylib binaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cordis = { workspace = true }
cordis-plugin-api = { workspace = true }
libloading = "0.8"
serde_json = { workspace = true }

# Optional: install plugins straight from a URL.
ureq = { version = "2", optional = true }

[features]
download = ["dep:ureq"]

[dev-dependencies]
serde = { workspace = true }
