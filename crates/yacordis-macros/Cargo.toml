[package]
name = "yacordis-macros"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Leawind/yacordis"
rust-version = "1.85"
description = "Attribute macros for declaring yacordis components"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
serde_json = { workspace = true }
yacordis = { workspace = true }
